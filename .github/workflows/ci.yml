name: CI

on:
  # Every push to main must receive a SonarCloud analysis, including docs changes.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Tests (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
        exclude:
          - os: windows-latest
            java: '21'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Temurin Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test and generate coverage
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-${{ matrix.os }}-java-${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: error
          retention-days: 30
      - name: Upload JaCoCo coverage
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-${{ matrix.os }}-java-${{ matrix.java }}
          path: target/site/jacoco/
          if-no-files-found: error
          retention-days: 30

  sonar:
    name: SonarCloud and Quality Gate
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
    steps:
      - name: Check out full history for SonarCloud
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Temurin Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check SonarCloud configuration
        shell: bash
        run: |
          test -n "$SONAR_TOKEN" || { echo '::error::Repository secret SONAR_TOKEN is missing.'; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo '::error::Repository variable SONAR_ORGANIZATION is missing.'; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo '::error::Repository variable SONAR_PROJECT_KEY is missing.'; exit 1; }
      - name: Build, analyze and wait for Quality Gate
        shell: bash
        run: >-
          mvn --batch-mode --no-transfer-progress clean verify sonar:sonar
          "-Dsonar.organization=$SONAR_ORGANIZATION"
          "-Dsonar.projectKey=$SONAR_PROJECT_KEY"
          "-Dsonar.host.url=$SONAR_HOST_URL"
          -Dsonar.qualitygate.wait=true
